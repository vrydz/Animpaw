<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8" />
  
  <!-- Outer Tech Hexagon / Card Emblem Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.8"/>

  <!-- Cyber Cat Ears -->
  <polygon points="120,230 160,95 240,190" fill="url(#goldGrad)" />
  <polygon points="145,210 170,120 220,185" fill="#0f172a" />
  <polygon points="392,230 352,95 272,190" fill="url(#goldGrad)" />
  <polygon points="367,210 342,120 292,185" fill="#0f172a" />

  <!-- Cyber Cat Head Outline -->
  <path d="M140,230 C130,340 180,410 256,410 C332,410 382,340 372,230 C360,195 330,180 256,180 C182,180 152,195 140,230 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Futuristic Glowing Visor / Eyes -->
  <path d="M165,260 Q256,295 347,260 Q340,305 256,310 Q172,305 165,260 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Cat Nose & Whisker Accents -->
  <polygon points="256,330 248,342 264,342" fill="#f59e0b" />
  <path d="M256,342 Q246,355 235,350 M256,342 Q266,355 277,350" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>

  <!-- Tech Whiskers -->
  <line x1="130" y1="290" x2="90" y2="280" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="130" y1="315" x2="95" y2="325" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
  <line x1="382" y1="290" x2="422" y2="280" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="382" y1="315" x2="417" y2="325" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>

  <!-- Sparkle Crest Badge on Forehead -->
  <polygon points="256,200 262,215 277,221 262,227 256,242 250,227 235,221 250,215" fill="#fef08a" filter="url(#glow)"/>

  <!-- Bottom Brand Text -->
  <text x="256" y="465" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">NEKOMON</text>
</svg>
